name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, race tests, fuzzing, benchmarks, simulation)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and vet
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "Run gofmt on: $unformatted"; exit 1; }
          go vet ./...
      - name: Test with the race detector
        run: go test -race -count=1 ./...
      - name: Fuzz (60 s per target)
        run: |
          for target in "FuzzParseDims ./internal/topo" "FuzzGrid ./internal/topo" "FuzzScheduler ./internal/sched"; do
            set -- $target
            go test -run '^$' -fuzz "^$1\$" -fuzztime 60s "$2" 2>&1 | tee "fuzz-$1.log"
          done
          {
            echo "### Fuzzing, 60 s per target"
            echo "| Target | Inputs run |"
            echo "|---|---:|"
            for f in fuzz-*.log; do
              n=$(grep -o 'execs: [0-9]*' "$f" | tail -1 | grep -o '[0-9]*')
              name=${f#fuzz-}
              echo "| ${name%.log} | $n |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Placement benchmark
        run: |
          go test -run '^$' -bench . -benchmem ./internal/topo | tee bench.txt
          {
            echo "### Placement benchmark"
            echo '```'
            grep -E '^(cpu:|Benchmark)' bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Policy comparison (5 workloads of 2,000 jobs on a 512-chip pod)
        run: |
          go run ./cmd/slicewise simulate -jobs 2000 -seeds 5 | tee simulation.md
          { echo "### Policy comparison"; cat simulation.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: Web console (typecheck, unit and axe tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Unit, keyboard and axe-core tests (Vitest)
        run: npm test
      - run: npm run build
      - name: Bundle size
        run: |
          {
            echo "### Web bundle"
            echo "| File | gzip |"
            echo "|---|---:|"
            for f in dist/assets/*.js dist/assets/*.css; do
              printf '| %s | %.1f KB |\n' "$(basename "$f")" "$(gzip -9c "$f" | wc -c | awk '{print $1/1024}')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests (Playwright, axe WCAG 2.2 AA)
    needs: [go, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the console and embed it in the server
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          cp -r web/dist/. internal/webui/dist/
          go build -o slicewise ./cmd/slicewise
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: web
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p "$SCREENSHOT_DIR"
          npx playwright test
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            screenshots/
            web/playwright-report/
          if-no-files-found: ignore

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t slicewise .
      - name: Smoke test
        run: |
          docker run -d --name slicewise -p 8080:8080 slicewise
          for i in $(seq 30); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/api/v1/pod | head -c 300; echo
          curl -fs http://localhost:8080/jobs | grep -q '<div id="root">'
          docker rm -f slicewise
